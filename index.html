<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Главная · Портфолио</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>
        /* ===== ГЛОБАЛЬНЫЙ СТИЛЬ ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: #0a0a0f;
            color: #e4e4e7;
            min-height: 100vh;
            padding: 20px;
            background-image: radial-gradient(circle at 20% 30%, #1a1a2e 0%, #0a0a0f 90%);
            transition: background 0.5s;
        }
        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        /* ===== НАВИГАЦИЯ ===== */
        nav {
            display: flex;
            gap: 8px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            background: rgba(18, 18, 30, 0.7);
            padding: 12px 20px;
            border-radius: 60px;
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.06);
        }
        nav a {
            color: #a1a1aa;
            text-decoration: none;
            padding: 10px 24px;
            border-radius: 40px;
            font-size: 14px;
            font-weight: 600;
            transition: 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        nav a:hover,
        nav a.active {
            background: rgba(124, 58, 237, 0.2);
            color: #fff;
        }
        nav a.active {
            background: #7c3aed;
            color: #fff;
            box-shadow: 0 0 30px rgba(124, 58, 237, 0.3);
        }
        .nav-right {
            margin-left: auto;
            display: flex;
            gap: 8px;
            align-items: center;
        }

        /* ===== КАРТОЧКА ===== */
        .card {
            background: rgba(18, 18, 30, 0.8);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 40px;
            padding: 45px 40px;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.8);
            position: relative;
            overflow: hidden;
            min-height: 400px;
        }

        /* ===== ЧАСТИЦЫ ===== */
        #particles-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }
        .card>* {
            position: relative;
            z-index: 1;
        }

        /* ===== ГЛАВНАЯ ===== */
        .hero {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .hero h1 {
            font-size: 52px;
            font-weight: 800;
            letter-spacing: -2px;
            line-height: 1.1;
        }
        .hero h1 span {
            background: linear-gradient(135deg, #a78bfa, #6ee7b7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .hero .subtitle {
            font-size: 20px;
            color: #a1a1aa;
        }
        .hero .typing {
            display: inline-block;
            overflow: hidden;
            white-space: nowrap;
            border-right: 3px solid #7c3aed;
            animation: blink 0.8s step-end infinite;
        }
        @keyframes blink {
            0%,
            100% {
                border-color: #7c3aed;
            }
            50% {
                border-color: transparent;
            }
        }
        .hero .desc {
            color: #a1a1aa;
            line-height: 1.8;
            max-width: 550px;
            font-size: 16px;
        }

        .stats {
            display: flex;
            gap: 40px;
            margin-top: 20px;
            flex-wrap: wrap;
        }
        .stats div {
            text-align: center;
        }
        .stats .num {
            font-size: 32px;
            font-weight: 800;
            background: linear-gradient(135deg, #a78bfa, #6ee7b7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .stats .label {
            font-size: 13px;
            color: #71717a;
        }

        .badge-list {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin: 15px 0;
        }
        .badge-list span {
            background: rgba(255, 255, 255, 0.05);
            padding: 8px 20px;
            border-radius: 100px;
            font-size: 13px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            transition: 0.3s;
            cursor: default;
        }
        .badge-list span:hover {
            background: rgba(167, 139, 250, 0.15);
            border-color: #7c3aed;
            transform: translateY(-3px);
        }

        /* ===== ТЕМА ===== */
        .theme-toggle {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 60px;
            padding: 8px 18px;
            color: #e4e4e7;
            cursor: pointer;
            font-size: 14px;
            transition: 0.3s;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .theme-toggle:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: #7c3aed;
        }

        @media (max-width: 600px) {
            .card {
                padding: 25px 18px;
            }
            .hero h1 {
                font-size: 32px;
            }
            nav {
                border-radius: 20px;
                padding: 10px 14px;
            }
            nav a {
                padding: 6px 14px;
                font-size: 12px;
            }
            .nav-right {
                margin-left: 0;
                width: 100%;
            }
        }
    </style>
</head>
<body>

    <div class="container">

        <!-- ===== НАВИГАЦИЯ ===== -->
        <nav>
            <a href="index.html" class="active"><i class="fas fa-home"></i> Главная</a>
            <a href="projects.html"><i class="fas fa-folder-open"></i> Проекты</a>
            <a href="sandbox.html"><i class="fas fa-flask"></i> Песочница</a>
            <div class="nav-right">
                <button class="theme-toggle" id="themeToggle">
                    <i class="fas fa-moon"></i> <span id="themeLabel">Тёмная</span>
                </button>
            </div>
        </nav>

        <!-- ===== КАРТОЧКА ===== -->
        <div class="card">

            <canvas id="particles-canvas"></canvas>

            <div class="hero">
                <div style="display:flex; justify-content:space-between; align-items:flex-start; flex-wrap:wrap;">
                    <div>
                        <div style="background:#2a2a4a; padding:4px 16px; border-radius:100px; font-size:12px; color:#a78bfa; border:1px solid #3b3b6b; display:inline-block;">
                            <i class="fas fa-code"></i> Open for work
                        </div>
                    </div>
                    <div style="font-size:48px;">🚀</div>
                </div>

                <h1>Привет, я <span>Алексей</span></h1>
                <div class="subtitle">
                    <i class="fas fa-terminal"></i>
                    <span class="typing" id="typing-text">Junior Fullstack Developer</span>
                </div>
                <p class="desc">
                    Создаю веб-приложения, в которых хочется задержаться.
                    Люблю интерактив, анимации и чистый код.
                </p>

                <div class="badge-list">
                    <span>React</span>
                    <span>TypeScript</span>
                    <span>Node.js</span>
                    <span>Tailwind</span>
                    <span>Python</span>
                    <span>Three.js</span>
                </div>

                <div class="stats">
                    <div><div class="num" id="repoCount">0</div><div class="label">Проектов</div></div>
                    <div><div class="num" id="commitCount">0</div><div class="label">Коммитов</div></div>
                    <div><div class="num" id="starCount">0</div><div class="label">★ Звёзд</div></div>
                </div>

                <div style="display:flex; gap:14px; flex-wrap:wrap; margin-top:10px;">
                    <a href="projects.html" class="btn" style="background:#7c3aed; color:#fff; padding:14px 32px; border-radius:60px; text-decoration:none; font-weight:600; display:inline-flex; align-items:center; gap:10px; box-shadow:0 8px 25px rgba(124,58,237,0.3);">
                        <i class="fas fa-rocket"></i> Смотреть проекты
                    </a>
                    <a href="sandbox.html" class="btn" style="background:rgba(255,255,255,0.05); color:#e4e4e7; padding:14px 32px; border-radius:60px; text-decoration:none; font-weight:600; border:1px solid rgba(255,255,255,0.1); display:inline-flex; align-items:center; gap:10px;">
                        <i class="fas fa-gamepad"></i> Песочница
                    </a>
                </div>
            </div>

        </div>
    </div>

    <script>
        // ===== ЧАСТИЦЫ =====
        const canvas = document.getElementById('particles-canvas');
        const ctx = canvas.getContext('2d');
        let W, H;
        const particles = [];

        function resize() {
            const rect = canvas.parentElement.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = rect.height;
            W = canvas.width;
            H = canvas.height;
        }
        resize();
        window.addEventListener('resize', resize);

        for (let i = 0; i < 70; i++) {
            particles.push({
                x: Math.random() * W,
                y: Math.random() * H,
                dx: (Math.random() - 0.5) * 0.6,
                dy: (Math.random() - 0.5) * 0.6,
                r: Math.random() * 2 + 1,
                a: Math.random() * 0.4 + 0.1
            });
        }

        function draw() {
            ctx.clearRect(0, 0, W, H);
            particles.forEach(p => {
                p.x += p.dx;
                p.y += p.dy;
                if (p.x < 0 || p.x > W) p.dx *= -1;
                if (p.y < 0 || p.y > H) p.dy *= -1;
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(167, 139, 250, ${p.a})`;
                ctx.fill();
            });
            requestAnimationFrame(draw);
        }
        draw();

        // ===== ПЕЧАТЬ =====
        const text = "Junior Fullstack Developer";
        const el = document.getElementById('typing-text');
        let idx = 0;
        el.textContent = '';
        function type() {
            if (idx < text.length) {
                el.textContent += text.charAt(idx);
                idx++;
                setTimeout(type, 50);
            }
        }
        type();

        // ===== СТАТИСТИКА С GITHUB =====
        const USERNAME = 'your-username';

        async function fetchStats() {
            try {
                if (USERNAME === 'your-username') {
                    document.getElementById('repoCount').textContent = '12';
                    document.getElementById('commitCount').textContent = '84';
                    document.getElementById('starCount').textContent = '27';
                    return;
                }
                const res = await fetch(`https://api.github.com/users/${USERNAME}`);
                const data = await res.json();
                document.getElementById('repoCount').textContent = data.public_repos || 0;
                // коммиты не даёт API, ставим заглушку
                document.getElementById('commitCount').textContent = '∞';
                document.getElementById('starCount').textContent = '★';
            } catch {
                document.getElementById('repoCount').textContent = '?';
            }
        }
        fetchStats();

        // ===== ТЕМА =====
        let isDark = true;
        document.getElementById('themeToggle').addEventListener('click', function() {
            isDark = !isDark;
            document.body.style.background = isDark ? '#0a0a0f' : '#f0f0f5';
            document.body.style.backgroundImage = isDark ?
                'radial-gradient(circle at 20% 30%, #1a1a2e 0%, #0a0a0f 90%)' :
                'radial-gradient(circle at 20% 30%, #e0e0f0 0%, #f0f0f5 90%)';
            document.querySelector('.card').style.background = isDark ?
                'rgba(18,18,30,0.8)' :
                'rgba(255,255,255,0.8)';
            document.querySelector('.card').style.color = isDark ? '#e4e4e7' : '#1a1a2e';
            document.getElementById('themeLabel').textContent = isDark ? 'Тёмная' : 'Светлая';
            this.querySelector('i').className = isDark ? 'fas fa-moon' : 'fas fa-sun';
        });
    </script>

</body>
</html>
