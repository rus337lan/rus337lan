<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Проекты · Портфолио</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: #0a0a0f;
            color: #e4e4e7;
            min-height: 100vh;
            padding: 20px;
            background-image: radial-gradient(circle at 20% 30%, #1a1a2e 0%, #0a0a0f 90%);
            transition: background 0.5s;
        }
        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        nav {
            display: flex;
            gap: 8px;
            margin-bottom: 30px;
            flex-wrap: wrap;
            background: rgba(18, 18, 30, 0.7);
            padding: 12px 20px;
            border-radius: 60px;
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.06);
        }
        nav a {
            color: #a1a1aa;
            text-decoration: none;
            padding: 10px 24px;
            border-radius: 40px;
            font-size: 14px;
            font-weight: 600;
            transition: 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        nav a:hover,
        nav a.active {
            background: rgba(124, 58, 237, 0.2);
            color: #fff;
        }
        nav a.active {
            background: #7c3aed;
            color: #fff;
            box-shadow: 0 0 30px rgba(124, 58, 237, 0.3);
        }
        .nav-right {
            margin-left: auto;
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .card {
            background: rgba(18, 18, 30, 0.8);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 40px;
            padding: 45px 40px;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.8);
        }

        .page-title {
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 8px;
        }
        .page-title span {
            background: linear-gradient(135deg, #a78bfa, #6ee7b7);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .page-desc {
            color: #a1a1aa;
            margin-bottom: 25px;
        }

        /* ===== ФИЛЬТРЫ ===== */
        .filters {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 25px;
        }
        .filters button {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.06);
            padding: 8px 22px;
            border-radius: 40px;
            color: #a1a1aa;
            cursor: pointer;
            font-size: 13px;
            font-weight: 500;
            transition: 0.3s;
            font-family: 'Inter', sans-serif;
        }
        .filters button:hover,
        .filters button.active {
            background: rgba(124, 58, 237, 0.2);
            color: #fff;
            border-color: #7c3aed;
        }
        .filters button.active {
            background: #7c3aed;
            color: #fff;
        }

        /* ===== СЕТКА ПРОЕКТОВ ===== */
        .projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .project-card {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 24px;
            padding: 24px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: 0.35s;
            text-decoration: none;
            color: #e4e4e7;
            display: block;
            position: relative;
            overflow: hidden;
        }
        .project-card:hover {
            transform: translateY(-8px) scale(1.01);
            border-color: #7c3aed;
            box-shadow: 0 20px 50px rgba(124, 58, 237, 0.15);
            background: rgba(255, 255, 255, 0.06);
        }
        .project-card .icon {
            font-size: 28px;
            margin-bottom: 10px;
            display: block;
        }
        .project-card h3 {
            font-size: 18px;
            font-weight: 700;
        }
        .project-card p {
            color: #a1a1aa;
            font-size: 14px;
            line-height: 1.6;
            margin: 8px 0 14px;
        }
        .project-card .tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
        }
        .project-card .tags span {
            background: rgba(167, 139, 250, 0.12);
            padding: 3px 14px;
            border-radius: 100px;
            font-size: 11px;
            color: #a78bfa;
        }
        .project-card .stars {
            margin-top: 14px;
            font-size: 13px;
            color: #71717a;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .theme-toggle {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 60px;
            padding: 8px 18px;
            color: #e4e4e7;
            cursor: pointer;
            font-size: 14px;
            transition: 0.3s;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .theme-toggle:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: #7c3aed;
        }

        @media (max-width: 600px) {
            .card {
                padding: 25px 18px;
            }
            .projects-grid {
                grid-template-columns: 1fr;
            }
            nav {
                border-radius: 20px;
                padding: 10px 14px;
            }
            nav a {
                padding: 6px 14px;
                font-size: 12px;
            }
            .nav-right {
                margin-left: 0;
                width: 100%;
            }
        }
    </style>
</head>
<body>

    <div class="container">

        <nav>
            <a href="index.html"><i class="fas fa-home"></i> Главная</a>
            <a href="projects.html" class="active"><i class="fas fa-folder-open"></i> Проекты</a>
            <a href="sandbox.html"><i class="fas fa-flask"></i> Песочница</a>
            <div class="nav-right">
                <button class="theme-toggle" id="themeToggle">
                    <i class="fas fa-moon"></i> <span id="themeLabel">Тёмная</span>
                </button>
            </div>
        </nav>

        <div class="card">

            <div class="page-title">📂 Мои <span>проекты</span></div>
            <div class="page-desc">Все репозитории подгружаются с GitHub в реальном времени</div>

            <!-- ФИЛЬТРЫ -->
            <div class="filters" id="filterContainer">
                <button class="active" data-filter="all">Все</button>
                <button data-filter="JavaScript">JavaScript</button>
                <button data-filter="TypeScript">TypeScript</button>
                <button data-filter="Python">Python</button>
                <button data-filter="HTML">HTML</button>
            </div>

            <!-- СЕТКА ПРОЕКТОВ -->
            <div class="projects-grid" id="projectsContainer">
                <div style="grid-column:1/-1; text-align:center; padding:40px; color:#71717a;">
                    <i class="fas fa-spinner fa-spin fa-2x"></i>
                    <p style="margin-top:12px;">Загрузка проектов...</p>
                </div>
            </div>

        </div>
    </div>

    <script>
        const USERNAME = 'your-username';
        let allProjects = [];

        // ===== ЗАГРУЗКА ПРОЕКТОВ =====
        async function loadProjects() {
            const container = document.getElementById('projectsContainer');
            try {
                if (USERNAME === 'your-username') {
                    allProjects = [{
                        name: 'Замени username',
                        description: 'Укажи свой логин в script.js на странице projects.html',
                        language: 'JavaScript',
                        html_url: '#',
                        stargazers_count: 42
                    }, {
                        name: 'Крутой проект',
                        description: 'Здесь будут твои репозитории с GitHub',
                        language: 'TypeScript',
                        html_url: '#',
                        stargazers_count: 17
                    }, {
                        name: 'Ещё проект',
                        description: 'Подгружается через GitHub API',
                        language: 'Python',
                        html_url: '#',
                        stargazers_count: 8
                    }, {
                        name: 'Frontend App',
                        description: 'React + Tailwind',
                        language: 'HTML',
                        html_url: '#',
                        stargazers_count: 5
                    }];
                    renderProjects('all');
                    return;
                }

                const res = await fetch(`https://api.github.com/users/${USERNAME}/repos?sort=updated&per_page=20`);
                if (!res.ok) throw new Error();
                allProjects = await res.json();
                renderProjects('all');

                // Обновляем фильтры
                const langs = new Set(allProjects.map(p => p.language).filter(Boolean));
                const filterContainer = document.getElementById('filterContainer');
                const allBtn = filterContainer.querySelector('[data-filter="all"]');
                filterContainer.innerHTML = `<button class="active" data-filter="all">Все</button>`;
                langs.forEach(lang => {
                    const btn = document.createElement('button');
                    btn.dataset.filter = lang;
                    btn.textContent = lang;
                    filterContainer.appendChild(btn);
                });
                // вешаем события
                filterContainer.querySelectorAll('button').forEach(btn => {
                    btn.addEventListener('click', function() {
                        filterContainer.querySelectorAll('button').forEach(b => b.classList.remove('active'));
                        this.classList.add('active');
                        renderProjects(this.dataset.filter);
                    });
                });

            } catch {
                container.innerHTML =
                    `<div style="grid-column:1/-1; text-align:center; padding:40px; color:#71717a;"><i class="fas fa-exclamation-triangle"></i><p>Ошибка загрузки, проверь интернет</p></div>`;
            }
        }

        // ===== ОТРИСОВКА =====
        function renderProjects(filter) {
            const container = document.getElementById('projectsContainer');
            let filtered = allProjects;
            if (filter !== 'all') {
                filtered = allProjects.filter(p => p.language === filter);
            }
            if (filtered.length === 0) {
                container.innerHTML =
                    `<div style="grid-column:1/-1; text-align:center; padding:40px; color:#71717a;">Нет проектов с таким языком</div>`;
                return;
            }
            container.innerHTML = filtered.map(p => `
                <a href="${p.html_url || '#'}" class="project-card" target="_blank">
                    <span class="icon">${getIcon(p.language)}</span>
                    <h3>${p.name}</h3>
                    <p>${p.description || 'Интересный проект'}</p>
                    <div class="tags"><span>${p.language || 'JavaScript'}</span></div>
                    <div class="stars"><i class="fas fa-star" style="color:#fbbf24;"></i> ${p.stargazers_count || 0}</div>
                </a>
            `).join('');
        }

        function getIcon(lang) {
            const map = {
                JavaScript: '🟨',
                TypeScript: '🟦',
                Python: '🐍',
                HTML: '🌐',
                CSS: '🎨',
                Java: '☕',
                C: '⚙️',
                'C++': '⚙️',
                Ruby: '💎',
                Go: '🐹',
                Rust: '🦀'
            };
            return map[lang] || '📁';
        }

        loadProjects();

        // ===== ТЕМА =====
        let isDark = true;
        document.getElementById('themeToggle').addEventListener('click', function() {
            isDark = !isDark;
            document.body.style.background = isDark ? '#0a0a0f' : '#f0f0f5';
            document.body.style.backgroundImage = isDark ?
                'radial-gradient(circle at 20% 30%, #1a1a2e 0%, #0a0a0f 90%)' :
                'radial-gradient(circle at 20% 30%, #e0e0f0 0%, #f0f0f5 90%)';
            document.querySelector('.card').style.background = isDark ?
                'rgba(18,18,30,0.8)' :
                'rgba(255,255,255,0.8)';
            document.querySelector('.card').style.color = isDark ? '#e4e4e7' : '#1a1a2e';
            document.getElementById('themeLabel').textContent = isDark ? 'Тёмная' : 'Светлая';
            this.querySelector('i').className = isDark ? 'fas fa-moon' : 'fas fa-sun';
        });
    </script>

</body>
</html>
